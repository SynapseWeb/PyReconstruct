# Dependency updates.
#
# Security updates only, since 2026-10-06. Both limits are 0, so Dependabot
# opens no version-update pull requests: every run mailed everyone watching
# the repo, and a config change or a stale branch made it open, close and
# reopen pull requests in a burst. Versions are moved deliberately, by editing
# the pins. Security updates still open a pull request when an advisory lands;
# Dependabot handles those outside this schedule and outside the limit.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 0
    groups:
      routine:
        update-types: ["patch", "minor"]
    # Major versions of these break the current stack (numpy 2.x fails at
    # import under opencv-python 4.8; zarr 3 and opencv 5 change their APIs;
    # vedo, tifffile, trimesh and cloud-volume majors are untested here). Left
    # unignored they each hold a slot in open-pull-requests-limit indefinitely,
    # which on 2026-09-01 blocked the numpy update that was actually needed and
    # on 2026-10-06 blocked the routine group. They are taken deliberately, by
    # editing the pin, not by Dependabot.
    ignore:
      - dependency-name: "numpy"
        update-types: ["version-update:semver-major"]
      - dependency-name: "opencv-python"
        update-types: ["version-update:semver-major"]
      - dependency-name: "opencv-python-headless"
        update-types: ["version-update:semver-major"]
      - dependency-name: "zarr"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vedo"
        update-types: ["version-update:semver-major"]
      - dependency-name: "tifffile"
        update-types: ["version-update:semver-major"]
      - dependency-name: "trimesh"
        update-types: ["version-update:semver-major"]
      - dependency-name: "cloud-volume"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0
    groups:
      routine:
        update-types: ["patch", "minor", "major"]
    commit-message:
      prefix: "ci(deps)"
