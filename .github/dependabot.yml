# Dependency updates.
#
# Grouped on purpose: one pull request per ecosystem per week, rather than one
# per package. A single package's CVE list can otherwise open dozens of pull
# requests in a morning. Security updates still arrive immediately, outside
# this schedule, because Dependabot handles those separately.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      routine:
        update-types: ["patch", "minor"]
    # Major versions of these four break the current stack (numpy 2.x fails at
    # import under opencv-python 4.8; zarr 3 and opencv 5 change their APIs). Left
    # unignored they each hold a slot in open-pull-requests-limit indefinitely,
    # which on 2026-09-01 blocked the numpy update that was actually needed. They
    # are taken deliberately, by editing the pin, not by Dependabot.
    ignore:
      - dependency-name: "numpy"
        update-types: ["version-update:semver-major"]
      - dependency-name: "opencv-python"
        update-types: ["version-update:semver-major"]
      - dependency-name: "opencv-python-headless"
        update-types: ["version-update:semver-major"]
      - dependency-name: "zarr"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      routine:
        update-types: ["patch", "minor", "major"]
    commit-message:
      prefix: "ci(deps)"
